name: Validate publication
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 12.16.1
          runtime: node@24.19.0
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: node scripts/verify-checkpoint-history.mjs
      - run: pnpm typecheck
      - name: Build guarded Next output and independently verify the export
        run: |
          if node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { scripts = {} } = JSON.parse(readFileSync('package.json', 'utf8'));
          const audited = scripts.build === 'pnpm validate && next build && node scripts/export.mjs'
            && scripts.validate === 'node scripts/validate.mjs'
            && ['prebuild', 'postbuild', 'prevalidate', 'postvalidate'].every((hook) => !Object.hasOwn(scripts, hook));
          process.exit(audited ? 0 : 1);
          NODE
          then
            pnpm exec next build
            node scripts/export.mjs
          else
            pnpm build
          fi
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - run: cargo install docpact --version 0.1.9 --locked
      - run: docpact validate-config --root "$GITHUB_WORKSPACE" --strict
      - name: Check governed change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            docpact lint --root "$GITHUB_WORKSPACE" --base "$BASE_SHA" --head HEAD --format json
          else
            docpact lint --root "$GITHUB_WORKSPACE" --merge-base origin/main --format json
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: knowledge-base-static
          path: out/
