name: Validate publication
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: knowledge-base-validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Classify validation lane (fail-closed)
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HAS_FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ] || [ "$HAS_FULL_LABEL" = "true" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          docs_only="true"
          file_count=0
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            file_count=$((file_count + 1))
            case "$file" in
              _docs/*|AGENTS.md|README.md|.docpact/*) ;;
              *)
                docs_only="false"
                break
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" HEAD)
          if [ "$file_count" -gt 0 ] && [ "$docs_only" = "true" ]; then
            echo "mode=docs-only" >> "$GITHUB_OUTPUT"
          else
            echo "mode=full" >> "$GITHUB_OUTPUT"
          fi

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          version: 12.16.1
          runtime: node@24.19.0
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: node scripts/verify-checkpoint-history.mjs
      - run: pnpm typecheck
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Restore Docpact binary cache
        id: docpact-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/docpact
          key: docpact-bin-${{ runner.os }}-${{ runner.arch }}-0.1.9
      - name: Install and verify pinned Docpact
        run: |
          if [ ! -x "$HOME/.cargo/bin/docpact" ] || [ "$("$HOME/.cargo/bin/docpact" --version)" != "docpact 0.1.9" ]; then
            cargo install docpact --version 0.1.9 --locked
          fi
          "$HOME/.cargo/bin/docpact" --version
      - run: docpact validate-config --root "$GITHUB_WORKSPACE" --strict
      - name: Check governed change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            docpact lint --root "$GITHUB_WORKSPACE" --base "$BASE_SHA" --head HEAD --format json
          else
            docpact lint --root "$GITHUB_WORKSPACE" --merge-base origin/main --format json
          fi

  tests:
    name: tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          version: 12.16.1
          runtime: node@24.19.0
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Run balanced test shard
        run: node scripts/ci-test-shard.mjs --shard ${{ matrix.shard }} --total 4

  build:
    needs: plan
    if: needs.plan.outputs.mode != 'docs-only'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          version: 12.16.1
          runtime: node@24.19.0
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Restore Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: kb-next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'next.config.*') }}-${{ github.sha }}
          restore-keys: |
            kb-next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'next.config.*') }}-
      - name: Build guarded Next output and independently verify the export
        run: |
          if node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { scripts = {} } = JSON.parse(readFileSync('package.json', 'utf8'));
          const audited = scripts.build === 'pnpm validate && next build && node scripts/export.mjs'
            && scripts.validate === 'node scripts/validate.mjs'
            && ['prebuild', 'postbuild', 'prevalidate', 'postvalidate'].every((hook) => !Object.hasOwn(scripts, hook));
          process.exit(audited ? 0 : 1);
          NODE
          then
            pnpm exec next build
            node scripts/export.mjs
          else
            pnpm build
          fi

  validate:
    if: always()
    needs: [plan, checks, tests, build]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required publication gates
        env:
          MODE: ${{ needs.plan.outputs.mode }}
          PLAN_RESULT: ${{ needs.plan.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          test "$PLAN_RESULT" = "success"
          test "$CHECKS_RESULT" = "success"
          test "$TESTS_RESULT" = "success"
          if [ "$MODE" = "docs-only" ]; then
            test "$BUILD_RESULT" = "skipped" -o "$BUILD_RESULT" = "success"
          else
            test "$BUILD_RESULT" = "success"
          fi
