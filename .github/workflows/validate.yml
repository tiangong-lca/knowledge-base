name: Validate publication
on:
  pull_request:
    branches: ['diagnostic/kb-195-base-v1']
    types: [opened]
permissions:
  contents: read
jobs:
  single:
    if: >-
      github.event_name == 'pull_request' && github.repository == 'tiangong-lca/knowledge-base' && github.run_attempt == '1' && github.base_ref == 'diagnostic/kb-195-base-v1' && github.event.pull_request.base.sha == 'd139cbc47481f9b819cd71d5f17ac2903ce8ba58' && contains(fromJSON('["diagnostic/kb-195-v1-01-a","diagnostic/kb-195-v1-04-a","diagnostic/kb-195-v1-05-a","diagnostic/kb-195-v1-08-a"]'), github.head_ref)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: bb6ab1a0dc38fc70155714793381bbed46890af4
      - name: Attest fixed product source and hosted image
        run: |
          set -euo pipefail
          source=$(git rev-parse HEAD)
          tree=$(git rev-parse 'HEAD^{tree}')
          lock=$(git rev-parse HEAD:pnpm-lock.yaml)
          working_lock=$(sha256sum pnpm-lock.yaml | cut -d ' ' -f 1)
          test "$source" = 'bb6ab1a0dc38fc70155714793381bbed46890af4'
          test "$tree" = 'e24860dd12b8704ab1e38cb74e06a29f557a8a99'
          test "$lock" = '6290aaa833958693c8d038664d55928e8815418d'
          test "$working_lock" = '1113b5b1a07168629eb0dd5cf460b8ba8ef2e8f79decb9ff5ac150fe85b89737'
          test -n "$ImageOS"
          test -n "$ImageVersion"
          printf 'KB_AB_SOURCE %s %s %s %s %s %s\n' "$source" "$tree" "$lock" "$working_lock" "$ImageOS" "$ImageVersion"
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 12.16.1
          runtime: node@24.19.0
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: node scripts/verify-checkpoint-history.mjs
      - run: pnpm typecheck
      - name: Build guarded Next output and independently verify the export
        run: |
          if node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { scripts = {} } = JSON.parse(readFileSync('package.json', 'utf8'));
          const audited = scripts.build === 'pnpm validate && next build && node scripts/export.mjs'
            && scripts.validate === 'node scripts/validate.mjs'
            && ['prebuild', 'postbuild', 'prevalidate', 'postvalidate'].every((hook) => !Object.hasOwn(scripts, hook));
          process.exit(audited ? 0 : 1);
          NODE
          then
            pnpm exec next build
            node scripts/export.mjs
          else
            pnpm build
          fi
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - run: cargo install docpact --version 0.1.9 --locked
      - run: docpact validate-config --root "$GITHUB_WORKSPACE" --strict
      - name: Check governed change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            docpact lint --root "$GITHUB_WORKSPACE" --base "$BASE_SHA" --head HEAD --format json
          else
            docpact lint --root "$GITHUB_WORKSPACE" --merge-base origin/main --format json
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: knowledge-base-static
          path: out/
  dual-tests:
    if: >-
      github.event_name == 'pull_request' && github.repository == 'tiangong-lca/knowledge-base' && github.run_attempt == '1' && github.base_ref == 'diagnostic/kb-195-base-v1' && github.event.pull_request.base.sha == 'd139cbc47481f9b819cd71d5f17ac2903ce8ba58' && contains(fromJSON('["diagnostic/kb-195-v1-02-b","diagnostic/kb-195-v1-03-b","diagnostic/kb-195-v1-06-b","diagnostic/kb-195-v1-07-b"]'), github.head_ref)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: bb6ab1a0dc38fc70155714793381bbed46890af4
      - name: Attest fixed product source and hosted image
        run: |
          set -euo pipefail
          source=$(git rev-parse HEAD)
          tree=$(git rev-parse 'HEAD^{tree}')
          lock=$(git rev-parse HEAD:pnpm-lock.yaml)
          working_lock=$(sha256sum pnpm-lock.yaml | cut -d ' ' -f 1)
          test "$source" = 'bb6ab1a0dc38fc70155714793381bbed46890af4'
          test "$tree" = 'e24860dd12b8704ab1e38cb74e06a29f557a8a99'
          test "$lock" = '6290aaa833958693c8d038664d55928e8815418d'
          test "$working_lock" = '1113b5b1a07168629eb0dd5cf460b8ba8ef2e8f79decb9ff5ac150fe85b89737'
          test -n "$ImageOS"
          test -n "$ImageVersion"
          printf 'KB_AB_SOURCE %s %s %s %s %s %s\n' "$source" "$tree" "$lock" "$working_lock" "$ImageOS" "$ImageVersion"
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 12.16.1
          runtime: node@24.19.0
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: node scripts/verify-checkpoint-history.mjs
  dual-publication:
    if: >-
      github.event_name == 'pull_request' && github.repository == 'tiangong-lca/knowledge-base' && github.run_attempt == '1' && github.base_ref == 'diagnostic/kb-195-base-v1' && github.event.pull_request.base.sha == 'd139cbc47481f9b819cd71d5f17ac2903ce8ba58' && contains(fromJSON('["diagnostic/kb-195-v1-02-b","diagnostic/kb-195-v1-03-b","diagnostic/kb-195-v1-06-b","diagnostic/kb-195-v1-07-b"]'), github.head_ref)
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: bb6ab1a0dc38fc70155714793381bbed46890af4
      - name: Attest fixed product source and hosted image
        run: |
          set -euo pipefail
          source=$(git rev-parse HEAD)
          tree=$(git rev-parse 'HEAD^{tree}')
          lock=$(git rev-parse HEAD:pnpm-lock.yaml)
          working_lock=$(sha256sum pnpm-lock.yaml | cut -d ' ' -f 1)
          test "$source" = 'bb6ab1a0dc38fc70155714793381bbed46890af4'
          test "$tree" = 'e24860dd12b8704ab1e38cb74e06a29f557a8a99'
          test "$lock" = '6290aaa833958693c8d038664d55928e8815418d'
          test "$working_lock" = '1113b5b1a07168629eb0dd5cf460b8ba8ef2e8f79decb9ff5ac150fe85b89737'
          test -n "$ImageOS"
          test -n "$ImageVersion"
          printf 'KB_AB_SOURCE %s %s %s %s %s %s\n' "$source" "$tree" "$lock" "$working_lock" "$ImageOS" "$ImageVersion"
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 12.16.1
          runtime: node@24.19.0
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Build guarded Next output and independently verify the export
        run: |
          if node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { scripts = {} } = JSON.parse(readFileSync('package.json', 'utf8'));
          const audited = scripts.build === 'pnpm validate && next build && node scripts/export.mjs'
            && scripts.validate === 'node scripts/validate.mjs'
            && ['prebuild', 'postbuild', 'prevalidate', 'postvalidate'].every((hook) => !Object.hasOwn(scripts, hook));
          process.exit(audited ? 0 : 1);
          NODE
          then
            pnpm exec next build
            node scripts/export.mjs
          else
            pnpm build
          fi
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - run: cargo install docpact --version 0.1.9 --locked
      - run: docpact validate-config --root "$GITHUB_WORKSPACE" --strict
      - name: Check governed change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            docpact lint --root "$GITHUB_WORKSPACE" --base "$BASE_SHA" --head HEAD --format json
          else
            docpact lint --root "$GITHUB_WORKSPACE" --merge-base origin/main --format json
          fi
      - name: Require the test peer before retaining the publication artifact
        env:
          GH_TOKEN: ${{ github.token }}
          PEER_JOB_NAME: dual-tests
        run: |
          set -euo pipefail
          route="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100"
          while :; do
            jobs=$(gh api "$route")
            printf '%s' "$jobs" | jq -e '.total_count == (.jobs | length)' >/dev/null
            peers=$(printf '%s' "$jobs" | jq --arg peer "$PEER_JOB_NAME" '[.jobs[] | select(.name == $peer)]')
            count=$(printf '%s' "$peers" | jq 'length')
            if [ "$count" -gt 1 ]; then
              echo "Expected exactly one test peer; received $count" >&2
              exit 1
            fi
            if [ "$count" -eq 0 ]; then
              echo 'KB_AB_PEER_WAIT not-yet-visible'
              sleep 5
              continue
            fi
            status=$(printf '%s' "$peers" | jq -r '.[0].status')
            if [ "$status" = completed ]; then
              conclusion=$(printf '%s' "$peers" | jq -r '.[0].conclusion')
              test "$conclusion" = success
              echo 'KB_AB_PEER_SUCCESS'
              break
            fi
            case "$status" in
              queued|in_progress|waiting|pending|requested)
                echo "KB_AB_PEER_WAIT $status"
                sleep 5
                ;;
              *) echo "Unexpected test peer status: $status" >&2; exit 1 ;;
            esac
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: knowledge-base-static
          path: out/
